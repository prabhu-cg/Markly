<svg width="1800" height="560" viewBox="0 0 1800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#164e63;stop-opacity:1" />
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowDrop">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1800" height="560" fill="url(#bgGrad)"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1800" height="560" fill="url(#grid)"/>

  <!-- Animated circles in background -->
  <circle cx="200" cy="150" r="120" fill="url(#iconGrad)" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1600" cy="400" r="150" fill="url(#purpleAccent)" opacity="0.08" filter="url(#glow)"/>

  <!-- LEFT SECTION: Input/Document -->
  <g transform="translate(80, 100)">
    <!-- Document illustration -->
    <g filter="url(#shadowDrop)">
      <!-- Document card background -->
      <rect x="0" y="0" width="280" height="340" rx="16" fill="rgba(255,255,255,0.95)" stroke="url(#purpleAccent)" stroke-width="2"/>

      <!-- Document icon area -->
      <rect x="20" y="20" width="240" height="240" rx="12" fill="#f8fafc" stroke="rgba(167, 139, 250, 0.2)" stroke-width="2" stroke-dasharray="8,4"/>

      <!-- Page lines -->
      <line x1="40" y1="70" x2="220" y2="70" stroke="#c7d2e0" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <line x1="40" y1="110" x2="220" y2="110" stroke="#c7d2e0" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <line x1="40" y1="150" x2="220" y2="150" stroke="#c7d2e0" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <line x1="40" y1="190" x2="160" y2="190" stroke="#c7d2e0" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

      <!-- Document type icons at bottom -->
      <g transform="translate(20, 280)">
        <text x="15" y="15" font-size="14" font-weight="700" fill="#7c3aed">📄</text>
        <text x="65" y="15" font-size="14" font-weight="700" fill="#7c3aed">📝</text>
        <text x="115" y="15" font-size="14" font-weight="700" fill="#7c3aed">📊</text>
        <text x="165" y="15" font-size="14" font-weight="700" fill="#7c3aed">📋</text>
        <text x="215" y="15" font-size="12" fill="#94a3b8" font-family="system-ui">+JSON</text>
      </g>
    </g>

    <!-- Label -->
    <text x="140" y="380" font-size="16" font-weight="700" fill="white" text-anchor="middle" font-family="system-ui">Input Files</text>
  </g>

  <!-- CENTER: Lightning bolt icon and transformation -->
  <g transform="translate(520, 200)">
    <!-- Lightning bolt icon from app -->
    <g filter="url(#glow)">
      <circle cx="40" cy="40" r="45" fill="url(#iconGrad)" opacity="0.2"/>
      <svg x="0" y="0" width="80" height="80" viewBox="0 0 48 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="url(#iconGrad)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
      </svg>
    </g>

    <!-- Spark effects -->
    <circle cx="20" cy="10" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="70" cy="25" r="2.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="15" cy="65" r="2" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Processing text -->
  <g transform="translate(520, 320)">
    <text x="40" y="0" font-size="16" font-weight="700" fill="white" text-anchor="middle" font-family="system-ui">Instant</text>
    <text x="40" y="25" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-family="system-ui">Processing</text>
  </g>

  <!-- Processing features floating -->
  <g transform="translate(680, 100)" opacity="0.9">
    <g>
      <rect x="0" y="0" width="180" height="50" rx="8" fill="rgba(167, 139, 250, 0.15)" stroke="url(#purpleAccent)" stroke-width="1"/>
      <text x="10" y="18" font-size="12" fill="rgba(255,255,255,0.9)" font-family="system-ui">✓ Validation</text>
      <text x="10" y="38" font-size="11" fill="rgba(255,255,255,0.7)" font-family="system-ui">Auto-fix issues</text>
    </g>

    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="rgba(167, 139, 250, 0.15)" stroke="url(#purpleAccent)" stroke-width="1"/>
      <text x="10" y="18" font-size="12" fill="rgba(255,255,255,0.9)" font-family="system-ui">✓ GFM Tables</text>
      <text x="10" y="38" font-size="11" fill="rgba(255,255,255,0.7)" font-family="system-ui">GitHub Markdown</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="rgba(167, 139, 250, 0.15)" stroke="url(#purpleAccent)" stroke-width="1"/>
      <text x="10" y="18" font-size="12" fill="rgba(255,255,255,0.9)" font-family="system-ui">✓ Dark Mode</text>
      <text x="10" y="38" font-size="11" fill="rgba(255,255,255,0.7)" font-family="system-ui">Beautiful themes</text>
    </g>
  </g>

  <!-- RIGHT SECTION: Output/Markdown -->
  <g transform="translate(1100, 100)">
    <!-- Markdown illustration -->
    <g filter="url(#shadowDrop)">
      <!-- Output card background -->
      <rect x="0" y="0" width="280" height="340" rx="16" fill="rgba(255,255,255,0.95)" stroke="url(#purpleAccent)" stroke-width="2"/>

      <!-- Markdown document area -->
      <rect x="20" y="20" width="240" height="240" rx="12" fill="#f9fafb"/>

      <!-- Markdown heading with # -->
      <text x="40" y="55" font-size="24" font-weight="700" fill="#7c3aed" font-family="system-ui">#</text>
      <line x1="70" y1="40" x2="240" y2="40" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>

      <!-- Markdown content lines -->
      <line x1="40" y1="80" x2="240" y2="80" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="110" x2="240" y2="110" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="140" x2="200" y2="140" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>

      <!-- Table/Code badge -->
      <rect x="40" y="180" width="60" height="28" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
      <text x="70" y="198" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle" font-family="system-ui">Code</text>

      <rect x="110" y="180" width="60" height="28" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
      <text x="140" y="198" font-size="12" font-weight="600" fill="#be123c" text-anchor="middle" font-family="system-ui">Table</text>

      <rect x="180" y="180" width="80" height="28" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
      <text x="220" y="198" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle" font-family="system-ui">Readable</text>

      <!-- Download/Copy buttons -->
      <g transform="translate(40, 230)">
        <rect x="0" y="0" width="100" height="28" rx="6" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <text x="50" y="18" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle" font-family="system-ui">Download</text>
      </g>

      <g transform="translate(150, 230)">
        <rect x="0" y="0" width="100" height="28" rx="6" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <text x="50" y="18" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle" font-family="system-ui">Copy</text>
      </g>
    </g>

    <!-- Label -->
    <text x="140" y="380" font-size="16" font-weight="700" fill="white" text-anchor="middle" font-family="system-ui">Output Modes</text>
  </g>

  <!-- BRANDING SECTION - Top Right -->
  <g transform="translate(1380, 80)">
    <!-- Logo icon with glow -->
    <g filter="url(#glow)">
      <circle cx="50" cy="50" r="48" fill="url(#iconGrad)" opacity="0.2"/>
      <svg x="10" y="10" width="80" height="80" viewBox="0 0 48 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="url(#iconGrad)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
      </svg>
    </g>
  </g>

  <!-- Title and Tagline -->
  <g transform="translate(1380, 210)">
    <text x="0" y="0" font-size="54" font-weight="900" fill="white" font-family="system-ui, -apple-system, sans-serif">Markly</text>
    <text x="0" y="50" font-size="18" fill="rgba(255,255,255,0.95)" font-family="system-ui">Smart Document to Markdown</text>
    <text x="0" y="78" font-size="16" fill="url(#purpleAccent)" font-family="system-ui">100% Client-Side • Zero Tracking</text>
  </g>

  <!-- Bottom feature highlights -->
  <g transform="translate(100, 500)">
    <g>
      <text x="0" y="0" font-size="13" fill="url(#purpleAccent)" font-weight="700" font-family="system-ui">⚡ Lightning Fast</text>
      <text x="0" y="22" font-size="11" fill="rgba(255,255,255,0.7)" font-family="system-ui">No server, no delays</text>
    </g>

    <g transform="translate(380, 0)">
      <text x="0" y="0" font-size="13" fill="url(#purpleAccent)" font-weight="700" font-family="system-ui">🔒 Completely Private</text>
      <text x="0" y="22" font-size="11" fill="rgba(255,255,255,0.7)" font-family="system-ui">Your data stays local</text>
    </g>

    <g transform="translate(800, 0)">
      <text x="0" y="0" font-size="13" fill="url(#purpleAccent)" font-weight="700" font-family="system-ui">🎨 Beautiful UI</text>
      <text x="0" y="22" font-size="11" fill="rgba(255,255,255,0.7)" font-family="system-ui">Dark and light modes</text>
    </g>

    <g transform="translate(1200, 0)">
      <text x="0" y="0" font-size="13" fill="url(#purpleAccent)" font-weight="700" font-family="system-ui">✨ Smart Features</text>
      <text x="0" y="22" font-size="11" fill="rgba(255,255,255,0.7)" font-family="system-ui">Auto-fix and validation</text>
    </g>
  </g>
</svg>