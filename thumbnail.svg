<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad)"/>

  <!-- Document shape -->
  <g transform="translate(128, 96)">
    <!-- Paper background -->
    <rect x="0" y="0" width="256" height="320" rx="16" fill="white" opacity="0.95"/>

    <!-- Document lines -->
    <line x1="32" y1="80" x2="224" y2="80" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="32" y1="120" x2="224" y2="120" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="32" y1="160" x2="224" y2="160" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="32" y1="200" x2="224" y2="200" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="32" y1="240" x2="160" y2="240" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Markdown symbol (#) overlaid -->
  <g transform="translate(256, 320)">
    <!-- # symbol -->
    <text x="0" y="0" font-size="120" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#</text>
  </g>

  <!-- Accent circle -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="white" stroke-width="4" opacity="0.1"/>
</svg>